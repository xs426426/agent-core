version: '3.8'

services:
  # Agent核心服务
  agent-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-agent
    ports:
      - "8000:8000"
    environment:
      # LLM 配置 - DeepSeek
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.deepseek.com}
      # 无人机后端
      - BACKEND_URL=${BACKEND_URL:-http://8.136.43.216}
      # 服务配置
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    volumes:
      - agent-data:/app/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/agent/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx反向代理（可选，用于HTTPS）
  nginx:
    image: nginx:alpine
    container_name: drone-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - agent-core
    restart: unless-stopped
    networks:
      - agent-network
    profiles:
      - with-nginx

networks:
  agent-network:
    driver: bridge

volumes:
  agent-data:
